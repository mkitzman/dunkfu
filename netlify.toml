# Static Vue build + functions; data lives in Netlify Blobs (see netlify/functions).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback so Vue Router history routes (e.g. /standings) resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
