<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dunkfu</title>
    <meta name="description" content="What happened in the NBA last night: scores, box scores, standings.">
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        // Dark unless the user picked light (OS preference is ignored).
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      })()
    </script>
    <meta name="theme-color" content="#1f2227">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600;700&family=Sora:wght@400;600;800&display=swap">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
